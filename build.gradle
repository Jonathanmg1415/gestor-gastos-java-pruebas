plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.3'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.practica'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.practica.expensetracker.Main'
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true   // SonarCloud reads the XML report
        html.required = false
    }
}

sonar {
    properties {
        property "sonar.projectKey", "Brayan Jaraba_pipeline-gestor-gastos"
        property "sonar.organization", "Brayan Jaraba"
        property "sonar.host.url", "https://sonarcloud.io"
        // Optional:
        // property "sonar.coverage.exclusions", "**/config/**,**/dto/**,**/*Application.java"
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'

    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
}

jmh {
    jmhVersion = '1.37'
    warmupIterations = 3
    iterations = 5
    fork = 1
    if (project.hasProperty('benchmark')) {
        includes = [project.property('benchmark')]
    }
}
